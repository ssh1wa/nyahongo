[project]
name = "nihongo-pc"
version = "0.1.0"
description = "PC 处理站：下载视频/音频，转写日语字幕，生成学习包"
requires-python = ">=3.12,<3.13"
dependencies = [
    "yt-dlp>=2025.9.26",
    "faster-whisper>=1.2.0",
    "av>=11,<16",  # faster-whisper 1.2 用到的 metadata_errors 参数在新版 PyAV 里被删了
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
    "sudachipy>=0.6.10",
    "sudachidict-core",
    "fastapi>=0.156.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
nihongo = "nihongo_pc.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nihongo_pc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
