<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>にゃほんご 电脑端</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <img class="brand-mark" src="icon.png" alt="">
      <span class="brand-text"><span lang="ja">にゃほんご</span><small>电脑端 · 学习库</small></span>
    </a>
    <nav class="topbar-actions">
      <span class="lan-chip" id="lan-chip" hidden></span>
      <button class="icon-btn" id="theme-toggle" title="切换深色 / 浅色">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </nav>
  </header>

  <main id="app"></main>

  <div class="drop-overlay" id="drop-overlay">
    <div class="drop-box">
      <svg viewBox="0 0 24 24" width="40" height="40"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      <p>松开鼠标，导入这个文件</p>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
